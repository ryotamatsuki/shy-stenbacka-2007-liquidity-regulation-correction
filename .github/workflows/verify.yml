name: Verify liquidity-regulation correction

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

jobs:
  mathematical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q code
      - run: python code/stage04_symbolic.py
      - run: python code/stage04a_independent.py

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and kernel-audit Lean proofs
        uses: leanprover/lean-action@v1
        with:
          build: true
          axiom-audit: true
          axiom-audit-root: LiquidityRegulationCorrection
          leanchecker: true
          leanchecker-args: "LiquidityRegulationCorrection"
          nanoda: false
      - name: Reject proof placeholders
        run: |
          if grep -R -nE '\b(sorry|admit)\b' formal --include='*.lean'; then
            echo "Lean proof placeholder found"
            exit 1
          fi

  manuscript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Build main manuscript
        working-directory: manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Build verification supplement
        working-directory: manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          test -s supplement.pdf
      - name: Fail on unresolved references or overfull boxes
        working-directory: manuscript
        run: |
          ! grep -E "Citation .* undefined|Reference .* undefined|There were undefined references|Overfull" main.log
          ! grep -E "Citation .* undefined|Reference .* undefined|There were undefined references|Overfull" supplement.log
      - name: Upload manuscript PDFs
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: |
            manuscript/main.pdf
            manuscript/supplement.pdf
